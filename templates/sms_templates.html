{{define "title"}}SMS Templates{{end}}
{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
  <h1 class="page-header">SMS Templates <small style="color:#777">(SHORT_DOMAIN=localhost em desenvolvimento)</small></h1>
  <div class="row" style="margin-bottom:15px">
    <div class="col-sm-12">
      <button id="btn-new" class="btn btn-primary" data-toggle="modal" data-target="#modal-tpl"><i class="fa fa-plus"></i> New Template</button>
    </div>
  </div>
  <div id="empty-tpl" class="alert alert-info" style="display:none">No templates yet.</div>
  <div class="table-responsive">
    <table id="tbl-tpl" class="table table-striped">
      <thead><tr><th style="width:70px">ID</th><th>Name</th><th>Preview</th><th style="width:160px">Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="modal-tpl" class="modal fade" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <form id="form-tpl" autocomplete="off">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
        <h4 class="modal-title">Add Template</h4>
      </div>
      <div class="modal-body">
        <input type="hidden" name="id"/>
        <div class="form-group"><label>Name</label><input class="form-control" name="name" required maxlength="64"/></div>
        <div class="form-group"><label>Body</label>
          <textarea class="form-control" name="body" rows="5" placeholder="Hello {first_name}, visit {link}" required></textarea>
          <div id="stats" style="margin-top:6px;color:#666">Chars: 0 • Segments: 0 • Encoding: GSM-7</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div></div>
</div>
{{end}}
{{define "scripts"}}
<script src="/js/dist/app/sms_templates.js"></script>
{{end}}
