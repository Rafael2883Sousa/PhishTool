{{define "title"}}SMS Profiles{{end}}

{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
  <h1 class="page-header">
    SMS Profiles
  </h1>

  <button id="btn-new" class="btn btn-primary" data-toggle="modal" data-target="#modal-profile">
    <i class="fa fa-plus"></i> New Profile
  </button>

  <div id="empty-state" class="alert alert-info" style="display:none">
    No profiles created yet. Let's create one!
  </div>

  <div class="table-responsive">
    <table id="tbl-profiles" class="table table-striped">
      <thead>
        <tr>
          <th style="width:70px">ID</th>
          <th>Name</th>
          <th>From</th>
          <th style="width:120px">Rate/min</th>
          <th style="width:160px">Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div id="modal-profile" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="modalProfileLabel">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <form id="form-profile" autocomplete="off">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
          <h4 class="modal-title" id="modalProfileLabel">Add SMS Profile</h4>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" />
          <div class="form-group">
            <label>Name</label>
            <input class="form-control" name="name" required maxlength="64" />
          </div>
          <div class="form-group">
            <label>Twilio Account SID</label>
            <input class="form-control" name="account_sid" required maxlength="64" />
          </div>
          <div class="form-group">
            <label>Twilio Auth Token <small>(leave blank on edit to keep)</small></label>
            <input class="form-control" name="auth_token" type="password" />
          </div>
          <div class="form-group">
            <label>From Number (E.164)</label>
            <input class="form-control" name="from_number" placeholder="+351XXXXXXXXX or +238XXXXXXX" required />
            <p class="help-block" id="e164-help" style="margin:4px 0 0">
              Accepts E.164. Examples: <code>+351XXXXXXXXX</code> (PT), <code>+238XXXXXXX</code> (CV).
            </p>
          </div>
          <div class="form-group">
            <label>Rate limit per minute</label>
            <input class="form-control" name="rate_limit_per_min" type="number" min="1" value="60" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{{end}}

{{define "scripts"}}
<script src="/js/dist/app/sms_profiles.js"></script>
{{end}}
