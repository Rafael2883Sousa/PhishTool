{{define "title"}}SMS Profiles{{end}}
{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
  <h1 class="page-header">SMS Profiles</h1>
  <div id="flashes" class="row"></div>

  <div class="row">
    <button type="button" class="btn btn-primary"
            onclick="edit(-1)" data-toggle="modal" data-backdrop="static" data-target="#modal">
      <i class="fa fa-plus"></i> New Profile
    </button>
  </div>
  &nbsp;

  <div id="loading"><i class="fa fa-spinner fa-spin fa-4x"></i></div>

  <div id="emptyMessage" class="row" style="display:none;">
    <div class="alert alert-info">No profiles created yet. Let's create one!</div>
  </div>

  <div class="row">
    <table id="profileTable" class="table" style="display:none;">
      <thead>
        <tr>
          <th class="col-md-4">Name</th>
          <th>From</th>
          <th>Rate/min</th>
          <th class="col-md-2 no-sort"></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" onclick="dismiss()">
          <span aria-hidden="true">&times;</span>
        </button>
        <h4 class="modal-title" id="profileModalLabel">New SMS Profile</h4>
      </div>
      <div class="modal-body">
        <div class="row" id="modal.flashes"></div>
        <form>
          <div class="form-group">
            <label class="control-label" for="name">Name:</label>
            <input type="text" class="form-control" placeholder="Profile name" id="name" autofocus />
            <label class="control-label" for="account_sid">Twilio Account SID:</label>
            <input type="text" class="form-control" placeholder="ACxxxxxxxx..." id="account_sid" required />
            <label class="control-label" for="auth_token">Twilio Auth Token <small class="text-muted">(leave blank to keep)</small>:</label>
            <input type="password" class="form-control" placeholder="••••••••" id="auth_token" />
            <label class="control-label" for="from_number">From Number (E.164):</label>
            <input type="text" class="form-control" placeholder="+3519XXXXXXX / +2389XXXXXX" id="from_number" required />
            <label class="control-label" for="rate_limit_per_min">Rate limit per minute:</label>
            <input type="number" min="1" class="form-control" value="60" id="rate_limit_per_min" required />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" data-dismiss="modal" class="btn btn-default" onclick="dismiss()">Cancel</button>
        <button type="button" class="btn btn-primary" id="modalSubmit">Save Profile</button>
      </div>
    </div>
  </div>
</div>
{{end}}
{{define "scripts"}}
<script src="/js/dist/app/sms_profiles.js"></script>
{{end}}
